<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية روكيت ليق الاحترافية</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --accent-blue: #58a6ff;
            --accent-orange: #f78166;
            --border-color: #30363d;
        }
        body {
            font-family: Tahoma, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .page-view {
            display: none;
        }
        .page-view.active {
            display: block;
        }
        h2 {
            color: var(--accent-blue);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        .progress-indicator {
            font-size: 14px;
            color: var(--accent-orange);
            margin-bottom: 10px;
            font-weight: bold;
        }
        .material-text {
            line-height: 1.8;
            margin-bottom: 25px;
            font-size: 16px;
        }
        .quiz-box {
            background: #21262d;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
        .options label {
            display: block;
            margin: 10px 0;
            cursor: pointer;
            background: #30363d;
            padding: 10px;
            border-radius: 5px;
            transition: 0.2s;
        }
        .options label:hover {
            background: #388bfd33;
        }
        .action-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 25px;
            display: block;
            width: 100%;
            font-weight: bold;
        }
        .action-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="dynamic-pages-container"></div>

    <!-- صفحة النتائج والشهادة (صفحة رقم 31) -->
    <div id="page-31" class="page-view">
        <h2>🏆 نتيجة الاختبار الشامل وشهادة الاحتراف</h2>
        <div class="material-text" style="text-align: center;">
            <p>درجة المواد السابقة: <span id="prevMaterialsScore" style="color: var(--accent-blue); font-weight: bold;">0</span> من 50</p>
            <p>درجة الاختبار النهائي: <span id="finalQuizScore" style="color: var(--accent-orange); font-weight: bold;">0</span> من 50</p>
            <h3>المجموع الكلي: <span id="totalScoreFinal" style="color: #2ea043; font-size: 24px;">0</span> من 100</h3>
        </div>

        <div id="certBox" style="display: none; border: 3px solid gold; padding: 20px; border-radius: 10px; text-align: center; background: #1f242c; margin-top: 20px;">
            <h1 style="color: gold;">🎓 شهادة احتراف روكيت ليق معتمدة</h1>
            <p>تُشهد أكاديمية الاحتراف بأن البطل قد أتم بنجاح كافة متطلبات المنهج واجتاز الاختبارات بكفاءة عالية.</p>
            <p style="margin-top: 30px; font-weight: bold;">موقعة ومعتمدة من الخبير: <strong>سالم الكعبي</strong></p>
        </div>

        <button class="action-btn" onclick="goToPage(1)" style="background-color: #30363d;">إعادة محاولة الاختبار</button>
    </div>
</div>

<script>
    const materialsData = [
        {
            title: "المادة 22: تحليل الريبلاي (Replay Review) لكشف الأخطاء القاتلة",
            text: "مشاهدة مبارياتك السابقة من نظام الـ Replays ليست مجرد متعة، بل هي أداة تشخيصية هندسية. عندما تشاهد خسارة سابقة، لا تنظر إلى أخطاء زملائك بل ركّز حصراً على أخطائك الشخصية: متى أهدرت التعزيز؟ متى اندفعت بشكل خاطئ؟ ولماذا فشلت في التصدي؟ رؤية الملعب من زاوية الخصم والملعب العام تكشف لك الفجوات الخفية في تمركزك.",
            q1: "ما هو الهدف الأساسي من مراجعة الريبلاي (Replay Review)؟", o1: ["كشف وتحليل أخطائك الشخصية وتمركزك بدقة", "التقاط صور تذكارية للسيارة", "معرفة سرعة الإنترنت أثناء المباراة"], a: 0,
            q2: "من أي منظور يُنصح بمشاهدة الريبلاي لرؤية الأخطاء بدقة؟", o2: ["من منظور الملعب العام ومنظور الخصم", "من منظور الشات النصي", "بدون كاميرا نهائياً"], a: 0,
            q3: "كيف تساعدك هذه المراجعة في تطوير مستقبلك التنافسي؟", o3: ["تمنعك من تكرار نفس الأخطاء القاتلة في المستقبل", "تزيد من سرعة سيارتك تلقائياً", "تعطيك نقاط مجانية"], a: 0
        },
        {
            title: "المادة 23: استراتيجيات اللعب الفردي في وضع 1v1",
            text: "وضع 1v1 في روكيت ليق هو الاختبار الحقيقي والأقسى لمهاراتك الفردية وقدرتك الدفاعية والهجومية؛ لأنه لا يوجد زميل ينقذك إذا أخطأت. في هذا الوضع، أي خطأ صغير أو اندفاع غير محسوب يعني هدفاً فورياً في مرماك. السر في الفوز بمباريات 1v1 هو التحلي بالصبر الشديد، إجبار الخصم على ارتكاب الخطأ الأول، واستغلال المساحات بحرص عبر التسديد الموجه أو المراوغة الأرضية الذكية دون إهدار التعزيز.",
            q1: "لماذا يُعتبر وضع 1v1 الاختبار الأقسى لمهارات اللاعب؟", o1: ["لأنه لا يوجد زميل ينقذك إذا ارتكبت أي خطأ", "لأن مبارياته تستغرق ساعات طويلة", "لأنه ممنوع في البطولات"], a: 0,
            q2: "ما هو المفتاح الأساسي للنجاح والفوز في مباريات 1v1؟", o2: ["الصبر الشديد وإجبار الخصم على ارتكاب الخطأ الأول", "الاندفاع المستمر والهجوم الأعمى", "الوقوف في زاوية الملعب"], a: 0,
            q3: "ما الذي يعنيه ارتكاب أي خطأ بسيط في الـ 1v1؟", o3: ["استقبال هدف فوري في مرماك", "الحصول على تعزيز مجاني", "توقف المباراة"], a: 0
        },
        {
            title: "المادة 24: ميكانيكيات الـ Wave Dash وسرعة التحرك الأرضي",
            text: "مفتاح التفوق في السرعة الأرضية دون استهلاك التعزيز يكمن في إتقان تقنية (Wave Dash). تتيح لك هذه المهارة تنفيذ قفزة خفيفة مع ميلان السيارة للأمام أو الجانب، ثم الهبوط على الأرض بحيث تتلامس عجلات السيارة الأربع مع العشب في نفس الفاصل الزمني، مما يولد دفعة سرعة فورية (Boostless Acceleration) تماثل سرعة استخدام التعزيز الصاروخي الكامل. إتقان الـ Wave Dash يجعلك تتحرك بسرعة مرعبة في أرجاء الملعب لتغطية المساحات.",
            q1: "ما هي الفائدة الكبرى من مهارة الـ Wave Dash؟", o1: ["الحصول على دفعة سرعة فورية دون استهلاك التعزيز", "إيقاف سيارة الخصم عن الحركة", "جعل السيارة تطير لسقف الملعب"], a: 0,
            q2: "كيف تتلامس عجلات السيارة عند تنفيذ الـ Wave Dash بنجاح؟", o2: ["تتلامس العجلات الأربع مع الأرض في نفس الفاصل الزمني تماماً", "تتلامس العجلات الخلفية فقط", "لا تلمس الأرض نهائياً"], a: 0,
            q3: "لماذا تهم هذه المهارة اللاعبين في الرانكات العالية؟", o3: ["لتوفير التعزيز والتحرك بسرعة مرعبة في الملعب", "لتزيين السيارة فقط", "لزيادة صوت المحرك"], a: 0
        },
        {
            title: "المادة 25: استراتيجيات التشتت والدفاع عن المرمى (Goalie Positioning)",
            text: "الدفاع الناجح لا يعني الوقوف ملتصقاً بخط المرمى طوال الوقت، لأن ذلك يحجب عنك رؤية الملعب ويمنح الخصم حرية التسديد من الزوايا المكشوفة. التمركز الصحيح للحارس (Goalie Positioning) يكون على خط إرسال الزاوية الخلفية للمرمى (Back Post)، حيث ترى الملعب كاملاً، وتتمكن من الانقضاض للأمام أو الصعود على القائم لصد أي كرة قادمة من الأعلى أو الجانب بفعالية مطلقة وبأقل استهلاك ممكن للتعزيز.",
            q1: "أين هو التمركز الأصح والأكثر فعالية لحارس المرمى؟", o1: ["ملتصقاً بمنتصف خط المرمى تماماً", "على خط إرسال الزاوية الخلفية للمرمى (Back Post)", "في منتصف ملعب الخصم"], a: 1,
            q2: "لماذا يُعتبر الوقوف في منتصف خط المرمى ملتصقاً خطأً؟", o2: ["لأنه يحجب عنك رؤية الملعب ويحد من زوايا التصدي", "لأنه يزيد من سرعة الكرة", "لأنه يمنحك تعزيزاً زائداً"], a: 0,
            q3: "ما هي ميزة التمركز في الـ Back Post؟", o3: ["رؤية الملعب كاملاً والقدرة على صد الكرات العالية والجانبية ببراعة", "منع الخصم من التحرك", "إنهاء المباراة سريعاً"], a: 0
        },
        {
            title: "المادة 26: العقلية التنافسية والتغلب على الـ Tilt والاحتراق النفسي",
            text: "الاحتراق النفسي والغضب (Tilt) هو العدو الأول للاعب روكيت ليق. عندما تخسر مباراتين أو ثلاث متتالية بسبب سوء الحظ أو أخطاء الزملاء، يبدأ الغضب في السيطرة عليك وتلعب بعشوائية متزايدة تؤدي لسلسلة هزائم ضخمة (Derank). المحترف الحقيقي يدرك متى يتوقف عن اللعب ويأخذ استراحة قصيرة لتصفية ذهنه (Reset)، مؤمناً بأن الأداء العالي يتطلب صفاءً ذهنياً وتركيزاً بعيداً عن الانفعالات العصبية المؤقتة.",
            q1: "ما هو التصرّف الصحيح عند التعرض لسلسلة هزائم متتالية والغضب (Tilt)؟", o1: ["الاستمرار في اللعب بغضب أشد", "أخذ استراحة قصيرة لتصفية الذهن (Reset) والابتعاد عن اللعبة مؤقتاً", "حذف اللعبة نهائياً"], a: 1,
            q2: "ما هو تأثير الغضب والانفعال العصبي على أداء اللاعب في المباريات؟", o2: ["يزيد من العشوائية ويؤدي لسلسلة هزائم ضخمة وسقوط بالرنك", "يحسن من مهارات التصويب الفائق", "يرفع سرعة الإنترنت"], a: 0,
            q3: "ما الذي يتطلبه تحقيق الأداء العالي والمستقر في روكيت ليق؟", o3: ["صفاءً ذهنياً وتركيزاً تاماً بعيداً عن الانفعالات", "اللعب لمدة 10 ساعات متواصلة", "تغيير يد التحكم يومياً"], a: 0
        },
        {
            title: "المادة 27: تقنيات الاستحواذ على الكرة وبناء اللعب الهادئ (Possession Play)",
            text: "ليست كل كرة تستحق التسديد العشوائي نحو مرمى الخصم. في كثير من الأحيان، تسديد الكرة بعشوائية يعني تسليمها مجدداً لدفاع الخصم وبناء هجمة مرتدة ضدك. مهارة الاستحواذ على الكرة (Possession Play) تعني التحكم بالكرة، إسقاطها على الأرض، والاحتفاظ بها أو تمريرها بهدوء لزميلك المتموضع في مكان أفضل، لإجبار الخصم على الخروج من مناطقه الدفاعية وخلق ثغرات حقيقية تسفر عن أهداف نظيفة.",
            q1: "ما هو الخطأ الشائع عند التعامل مع الكرات المشتركة في منتصف الملعب؟", o1: ["التسديد العشوائي للكرة وتسليمها لدفاع الخصم", "السيطرة الهادئة عليها", "تمريرها للزميل بدقة"], a: 0,
            q2: "ما الهدف الأساسي من الاستحواذ الهادئ على الكرة (Possession)؟", o2: ["إجبار الخصم على الخروج من مناطقه وخلق ثغرات حقيقية", "إضاعة الوقت فقط", "إبطاء سرعة اللعبة للأبد"], a: 0,
            q3: "كيف تساعدك هذه الاستراتيجية في الفوز بالمباريات الصعبة؟", o3: ["تمنع الهجمات المرتدة ضدك وتزيد من فرص التسجيل المنظم", "تزيد من سرعة سيارتك أضعافاً مضاعفة", "تعطيك نقاط إضافية"], a: 0
        },
        {
            title: "المادة 28: التفاعل التكتيكي مع الزملاء عبر الـ Quick Chat والوعي الميداني",
            text: "التواصل السريع والذكي مع الزملاء عبر نظام الـ Quick Chat (مثل: I got it!, Defending!, Passing!) يمثل لغة التفاهم الخفية في الفريق. استخدم هذه العبارات بحكمة وبتوقيت دقيق لتنبيه زملائك بنواياك الدفاعية والهجومية دون إزعاج أو إحداث تشتت. في نفس الوقت، نمِّ وعيك الميداني (Game Sense) بحيث تستطيع معرفة أماكن زملائك دون الحاجة للنظر المستمر إليهم، مستعيناً بصوت سياراتهم وحركة الكاميرا السريعة.",
            q1: "ما هو الغرض الاحترافي من استخدام الـ Quick Chat في اللعبة؟", o1: ["إزعاج الزملاء واستفزاز الخصم", "تنبيه الزملاء بالنوايا الدفاعية والهجومية بتوقيت دقيق", "تغيير إعدادات الصوت"], a: 1,
            q2: "ماذا يقصد بالوعي الميداني (Game Sense) تجاه الزملاء؟", o2: ["معرفة أماكن زملائك وحركتهم دون الحاجة للنظر إليهم مباشرة", "تجاهلهم كلياً أثناء المباراة", "التحكم بسياراتهم بدلاً منهم"], a: 0,
            q3: "كيف يؤثر التواصل السليم على نتائج الفريق التنافسية؟", o3: ["يقلل الاصطدامات بين الزملاء ويزيد من كفاءة الهجمات", "يؤدي لخسارة المباراة حتماً", "يبطئ سرعة اللعب"], a: 0
        },
        {
            title: "المادة 29: بروتوكولات الإحماء الاحترافي قبل المباريات التنافسية",
            text: "الدخول مباشرة إلى المباريات التنافسية (Ranked) دون إحماء مسبق يعد وصفة مؤكدة لفقدان التركيز وسوء الأداء في الدقائق الأولى. المحترف الحقيقي يبدأ يومه بجلسة إحماء (Warm-up) مدتها 15 إلى 20 دقيقة، تتضمن التدرب على الـ Freeplay لتسخين الأصابع والذاكرة العضلية، تنفيذ ضربات هوائية سريعة في الـ Custom Training، ولعب مباراة أو مباريات تدريبية (Casual) لضبط التوقيت الفيزيائي ورد الفعل قبل خوض معارك الرانك الحقيقية.",
            q1: "ما هو الأثر السلبي للدخول للمباريات التنافسية دون إحماء مسبق؟", o1: ["فقدان التركيز وسوء الأداء في الدقائق الأولى", "زيادة سرعة السيارة تلقائياً", "الحصول على نقاط إضافية"], a: 0,
            q2: "كم تستغرق جلسة الإحماء الاحترافية الموصى بها قبل الـ Ranked؟", o2: ["من 15 إلى 20 دقيقة", "ساعتان كاملتان", "دقيقة واحدة فقط"], a: 0,
            q3: "ما هي الأنشطة التي تتضمنها جلسة الإحماء المثالية؟", o3: ["التدرب في الـ Freeplay والـ Custom Training لضبط الذاكرة العضلية", "متابعة مقاطع فيديو كوميدية", "إيقاف تشغيل اللعبة"], a: 0
        },
        {
            title: "المادة 30: الملخص الشامل لأكاديمية الاحتراف والاختبار النهائي",
            text: "وصلنا إلى المحطة الأخيرة والخلاصة المكثفة لأعقد أسرار روكيت ليق التي درسناها في المواد الـ 29 السابقة. أنت الآن مؤهل تماماً لاجتياز الاختبار النهائي الشامل أدناه، والذي سيمنحك 50 درجة تضاف إلى 50 درجة من اختبارات المواد السابقة لنيل شهادة الاحتراف الرسمية!",
            q1: "ما هي القاعدة الأساسية لتأمين الدفاع في نظام التناوب الثلاثي؟", o1: ["الاندفاع المستمر معاً", "التناوب بانتظام ووجود لاعب أخير لتغطية عمق الملعب", "ترك المرمى خالياً"], a: 1,
            q2: "كيف تساهم الوسائط الصغيرة (Small Pads) في إدارة التعزيز بذكاء؟", o2: ["من خلال منحك مخزوناً ثابتاً من التعزيز دون مغادرة مركزك", "عبر استهلاك كل التعزيز مرة واحدة", "عبر منعك من الطيران"], a: 0,
            q3: "ما هو السلوك الذهني الأهم للوصول إلى رتبة SSL حسب الدراسة؟", o3: ["الهدوء، الصبر، مراجعة الريبلايز، والتغلب على الغضب", "الصراخ في الشات النصي", "اللعب العشوائي المستمر"], a: 0
        }
    ];

    let userScores = new Array(30).fill(0);
    let currentActivePage = 0;

    function renderMaterials() {
        const container = document.getElementById('dynamic-pages-container');
        let htmlContent = '';

        materialsData.forEach((mat, index) => {
            const pageNum = index + 1;
            const isLast = (pageNum === 30);
            
            htmlContent += `
                <div id="page-${pageNum}" class="page-view">
                    <div class="progress-indicator">المادة ${pageNum} من 30</div>
                    <h2>${mat.title}</h2>
                    <div class="material-text"><p>${mat.text}</p></div>

                    <div class="quiz-box">
                        <h3>اختبار المادة ${pageNum} (3 أسئلة قصيرة)</h3>
                        
                        <p><strong>س1: ${mat.q1}</strong></p>
                        <div class="options">
                            <label><input type="radio" name="m${pageNum}_q1" value="0"> أ) ${mat.o1[0]}</label>
                            <label><input type="radio" name="m${pageNum}_q1" value="1"> ب) ${mat.o1[1]}</label>
                            <label><input type="radio" name="m${pageNum}_q1" value="2"> ج) ${mat.o1[2]}</label>
                        </div>

                        <p style="margin-top: 15px;"><strong>س2: ${mat.q2}</strong></p>
                        <div class="options">
                            <label><input type="radio" name="m${pageNum}_q2" value="0"> أ) ${mat.o2[0]}</label>
                            <label><input type="radio" name="m${pageNum}_q2" value="1"> ب) ${mat.o2[1]}</label>
                            <label><input type="radio" name="m${pageNum}_q2" value="2"> ج) ${mat.o2[2]}</label>
                        </div>

                        <p style="margin-top: 15px;"><strong>س3: ${mat.q3}</strong></p>
                        <div class="options">
                            <label><input type="radio" name="m${pageNum}_q3" value="0"> أ) ${mat.o3[0]}</label>
                            <label><input type="radio" name="m${pageNum}_q3" value="1"> ب) ${mat.o3[1]}</label>
                            <label><input type="radio" name="m${pageNum}_q3" value="2"> ج) ${mat.o3[2]}</label>
                        </div>
                    </div>

                    ${isLast ? `
                        <div class="quiz-box" style="border-color: var(--accent-orange); margin-top: 30px;">
                            <h3 style="color: var(--accent-orange);">🎯 الاختبار النهائي الشامل (10 أسئلة لـ 50 درجة إضافية)</h3>
                            
                            <p><strong>1. ما الذي يميز أسلوب الأسطورة Zen في روكيت ليق؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_1" value="a"> أ) العشوائية في التسديد</label>
                                <label><input type="radio" name="final_1" value="b"> ب) المهارات الفردية المطلقة والذكاء التكتيكي في قراءة أخطاء الخصم</label>
                                <label><input type="radio" name="final_1" value="c"> ج) البقاء داخل المرمى دائماً</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>2. ما هي النسبة الصحيحة لـ Field of View المثالية؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_2" value="a"> أ) 110 درجات</label>
                                <label><input type="radio" name="final_2" value="b"> ب) 70 درجة</label>
                                <label><input type="radio" name="final_2" value="c"> ج) 90 درجة</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>3. كم نسبة التعزيز التي تمنحها الوسيطة الصغيرة الواحدة (Small Pad)؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_3" value="a"> أ) 5%</label>
                                <label><input type="radio" name="final_3" value="b"> ب) 12%</label>
                                <label><input type="radio" name="final_3" value="c"> ج) 50%</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>4. أين يجب أن يتمركز الحارس المحترف لتغطية الزوايا بكفاءة؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_4" value="a"> أ) على خط الزاوية الخلفية للمرمى (Back Post)</label>
                                <label><input type="radio" name="final_4" value="b"> ب) منتصف المرمى ملتصقاً بالشبك</label>
                                <label><input type="radio" name="final_4" value="c"> ج) في زاوية ملعب الخصم</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>5. ما هي فائدة تقنية الـ Half-Flip في اللعبة؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_5" value="a"> أ) عكس اتجاه السيارة 180 درجة بسرعة للعودة للدفاع</label>
                                <label><input type="radio" name="final_5" value="b"> ب) زيادة سرعة السيارة للأمام فقط</label>
                                <label><input type="radio" name="final_5" value="c"> ج) إيقاف اللعب مؤقتاً</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>6. ماذا تفعل عند التعرض لسلسلة هزائم وغضب (Tilt)؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_6" value="a"> أ) الاستمرار باللعب بغضب</label>
                                <label><input type="radio" name="final_6" value="b"> ب) أخذ استراحة قصيرة لتصفية الذهن (Reset)</label>
                                <label><input type="radio" name="final_6" value="c"> ج) مغادرة اللعبة نهائياً وحذف الحساب</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>7. ما هو التناوب الثلاثي (Rotation) الصحيح في وضع 3v3؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_7" value="a"> أ) مطاردة اللاعبين الثلاثة للكرة معاً</label>
                                <label><input type="radio" name="final_7" value="b"> ب) تبادل الأدوار بضغط الأول وتأمين الأخير للعمق الدفاعي بانتظام</label>
                                <label><input type="radio" name="final_7" value="c"> ج) وقوف الجميع في الدفاع</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>8. كيف توظف إعدادات يد تحكم DualSense لاحتراف الطيران؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_8" value="a"> أ) نقل زر القفز لـ L1 والتعزيز لـ R1 لتفريغ الإبهام الأيمن للكاميرا</label>
                                <label><input type="radio" name="final_8" value="b"> ب) إبقاء الإعدادات الافتراضية</label>
                                <label><input type="radio" name="final_8" value="c"> ج) إلغاء استخدام الأزرار الجانبية</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>9. ما هو تأثير مهارة الـ Wave Dash على السيارة؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_9" value="a"> أ) دفعة سرعة فورية أرضية دون استهلاك التعزيز</label>
                                <label><input type="radio" name="final_9" value="b"> ب) إبطاء حركة السيارة وتثبيتها</label>
                                <label><input type="radio" name="final_9" value="c"> ج) إجبار السيارة على الطيران لسقف الملعب</label>
                            </div>

                            <p style="margin-top: 15px;"><strong>10. من هو الخبير الذي أعد هذا المنهج الشامل لطريقك للاحتراف؟</strong></p>
                            <div class="options">
                                <label><input type="radio" name="final_10" value="a"> أ) سالم الكعبي</label>
                                <label><input type="radio" name="final_10" value="b"> ب) شخص مجهول</label>
                                <label><input type="radio" name="final_10" value="c"> ج) شركة باتل فيلد</label>
                            </div>
                        </div>
                    ` : ''}

                    <button class="action-btn" onclick="submitMaterialAndNext(${pageNum})">
                        ${isLast ? 'إرسال الاختبار النهائي وعرض النتيجة والشهادة' : `تصحيح اختبار المادة ${pageNum} والانتقال للمادة ${pageNum + 1}`}
                    </button>
                </div>
            `;
        });

        container.innerHTML = htmlContent;
        goToPage(1);
    }

    function goToPage(pageNum) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        const target = document.getElementById(`page-${pageNum}`);
        if (target) {
            target.classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
            currentActivePage = pageNum;
        }
    }

    function submitMaterialAndNext(pageNum) {
        let correctCount = 0;
        const matObj = materialsData[pageNum - 1];

        const q1Selected = document.querySelector(`input[name="m${pageNum}_q1"]:checked`);
        const q2Selected = document.querySelector(`input[name="m${pageNum}_q2"]:checked`);
        const q3Selected = document.querySelector(`input[name="m${pageNum}_q3"]:checked`);

        if (q1Selected && parseInt(q1Selected.value) === matObj.a) correctCount++;
        if (q2Selected && parseInt(q2Selected.value) === matObj.a) correctCount++;
        if (q3Selected && parseInt(q3Selected.value) === matObj.a) correctCount++;

        userScores[pageNum - 1] = correctCount;

        if (pageNum < 30) {
            alert(`أحسنت! أتممت المادة ${pageNum} بنجاح. أجبْت عن ${correctCount} من 3 أسئلة بشكل صحيح. جاري نقلك للمادة ${pageNum + 1}...`);
            goToPage(pageNum + 1);
        } else {
            const finalAnswers = { final_1: 'b', final_2: 'a', final_3: 'b', final_4: 'a', final_5: 'a', final_6: 'b', final_7: 'b', final_8: 'a', final_9: 'a', final_10: 'a' };
            let finalCorrect = 0;

            for (let key in finalAnswers) {
                let sel = document.querySelector(`input[name="${key}"]:checked`);
                if (sel && sel.value === finalAnswers[key]) {
                    finalCorrect++;
                }
            }

            let finalQuizScoreVal = finalCorrect * 5;
            let totalMaterialCorrect = userScores.reduce((a, b) => a + b, 0);
            let prevMaterialsScoreVal = Math.round((totalMaterialCorrect / 90) * 50);
            let totalScoreFinalVal = finalQuizScoreVal + prevMaterialsScoreVal;

            document.getElementById('finalQuizScore').innerText = finalQuizScoreVal;
            document.getElementById('prevMaterialsScore').innerText = prevMaterialsScoreVal;
            document.getElementById('totalScoreFinal').innerText = totalScoreFinalVal;

            goToPage(31);

            const certBox = document.getElementById('certBox');
            if (totalScoreFinalVal >= 60) {
                certBox.style.display = 'block';
                alert(`تهانينا البطل! النتيجة النهائية هي ${totalScoreFinalVal} من 100. لقد أثبت كفاءتك وتم إصدار الشهادة الرسمية.`);
            } else {
                certBox.style.display = 'none';
                alert(`نتيجتك النهائية هي ${totalScoreFinalVal} من 100. لم تتجاوز حد الاجتياز (60 درجة). يُرجى المراجعة وإعادة المحاولة!`);
            }
        }
    }

    window.onload = function() {
        renderMaterials();
    };
</script>

</body>
</html>
